# Source Authority Map — Phase A of Substrate Query Orchestrator
#
# Spec: docs/specs/substrate-query-orchestrator-phase-a-scope.md v4 §2.
#
# Each `publisher` is the token authority-map.ts extracts from a citation's
# host portion. Unknown publishers throw UnknownPublisherError unless
# --allow-unknown is passed (Hardening 1).
#
# Tiers:
#   A = primary/regulatory/operator-quoted (NTIA, FCC, company press releases)
#   B = trade press / podcast operator interviews
#   C = analyst commentary / conference speaker pages (not the operator themselves)
#   D = reserved for unknown-with-flag fallback (do NOT seed this tier here)
#
# This file is the lint target for the weekly RemoteTrigger (§10).
# DO NOT add tier=D rows here; that tier is reserved for runtime fallback.
#
# 30 hand-labeled rows seeded for SC #4 (publisher map ≥27/30 correct on
# tests/fixtures/publisher-labels.json AND <15% unknown-rate on 756-row corpus).
#
# Last reviewed: 2026-06-09

